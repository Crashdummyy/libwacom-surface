name: Create Release Assets

on:
  push:
    branches:
      - 'master'

jobs:
  buildrpms:
    runs-on: ubuntu-latest
    container:
      image: quay.io/fedora/fedora:43

    steps:
      - name: Clone code
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          dnf install -y rpmdevtools rpm-sign gh rpkg python3-setuptools 'dnf-command(builddep)'
          dnf builddep -y pkg/fedora/libwacom-surface.spec

      - name: Make build
        run: |
          cd "./pkg/fedora"
          ./makerpm

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "./pkg/fedora"
          version="$(grep -i '^Version:' ./libwacom-surface.spec |  awk '{print $2}')"
          gh release create "$version" -t "$version" --repo="${{ github.repository }}" --target="${{ github.sha }}" --generate-notes ./out/*.src.rpm ./out/x86_64/*.rpm ./out/noarch/*.rpm

      - name: Install copr-cli
        run: dnf install copr-cli -y

      - name: Add login to copr
        run: |
          echo "${{ secrets.COPR_CREDENTIALS }}" >> "./coprConfig"

      - name: Upload to COPR
        run: copr-cli --config "./coprConfig" build LinuxSurface pkg/fedora/out/*.src.rpm

